name: Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux Unit & Integration Tests
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MOLE_TEST_NO_AUTH: "1"
      BATS_FORMATTER: tap
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck parallel
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version
          shellcheck --version

      # Mirrors scripts/test.sh (which stays untouched): block real sudo,
      # osascript, and launchctl for the whole run.
      - name: Prepare system command stubs
        run: |
          STUB_DIR="${RUNNER_TEMP}/mole-test-stubs"
          mkdir -p "$STUB_DIR"
          printf '#!/bin/bash\ncase "${1:-}" in\n  -k) exit 0 ;;\n  -n) exit 1 ;;\nesac\nprintf '"'"'mole test blocked sudo: %s\n'"'"' "$*" >&2\nexit 1\n' > "$STUB_DIR/sudo"
          printf '#!/bin/bash\nprintf '"'"'mole test blocked osascript: %s\n'"'"' "$*" >&2\nexit 1\n' > "$STUB_DIR/osascript"
          printf '#!/bin/bash\nprintf '"'"'mole test blocked launchctl: %s\n'"'"' "$*" >&2\nexit 0\n' > "$STUB_DIR/launchctl"
          chmod +x "$STUB_DIR/sudo" "$STUB_DIR/osascript" "$STUB_DIR/launchctl"
          echo "PATH=$STUB_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Lint test and library scripts
        run: |
          TEST_FILES=()
          while IFS= read -r file; do
              TEST_FILES+=("$file")
          done < <(find tests lib -type f \( -name '*.bats' -o -name '*.sh' \) | sort)
          shellcheck --rcfile .shellcheckrc "${TEST_FILES[@]}"

      - name: Build Go test helpers
        run: |
          GO_HELPER_DIR="${RUNNER_TEMP}/mole-go-helpers"
          mkdir -p "$GO_HELPER_DIR"
          go build -o "$GO_HELPER_DIR/analyze-go" ./cmd/analyze
          go build -o "$GO_HELPER_DIR/status-go" ./cmd/status
          echo "MOLE_TEST_ANALYZE_BIN=$GO_HELPER_DIR/analyze-go" >> "$GITHUB_ENV"
          echo "MOLE_TEST_STATUS_BIN=$GO_HELPER_DIR/status-go" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          [[ -n "${TERM:-}" ]] || export TERM="xterm-256color"
          unset NO_COLOR || true
          BATS_FILES=()
          while IFS= read -r file; do
              BATS_FILES+=("$file")
          done < <(find tests -type f -name '*.bats' | sort)
          bats --formatter tap "${BATS_FILES[@]}"

      - name: Run Go tests
        run: go test ./...

  compatibility:
    name: macOS
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: brew install bats-core coreutils

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Smoke load on ${{ matrix.os }}
        run: |
          echo "Testing on ${{ matrix.os }}..."
          bash -n mole
          source lib/core/common.sh
          echo "✓ Successfully loaded on ${{ matrix.os }}"

      - name: Run core bats subset
        env:
          MOLE_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          bats tests/core_safe_functions.bats \
               tests/core_common.bats \
               tests/core_timeout.bats \
               tests/regression.bats \
               tests/cli.bats

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for unsafe rm usage
        run: |
          echo "Checking for unsafe rm patterns..."
          if grep -rn "rm -rf" lib/ bin/ install.sh mole 2>/dev/null | grep -v -E "safe_remove|validate_path|# SAFE|^[^:]+:[0-9]+:[[:space:]]*#|echo "; then
            echo "✗ Unsafe rm -rf usage found (annotate gated calls with '# SAFE: <reason>' or route through safe_remove)"
            exit 1
          fi
          echo "✓ No unsafe rm usage found"

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run high-risk path regression tests
        env:
          MOLE_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          sudo apt-get update && sudo apt-get install -y bats parallel
          bats tests/core_safe_functions.bats tests/purge.bats tests/installer.bats
