name: Release

on:
  push:
    tags:
      - 'V*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: release-linux-amd64
            artifact_name: binaries-linux-amd64
          - os: ubuntu-latest
            target: release-linux-arm64
            artifact_name: binaries-linux-arm64
          - os: macos-latest
            target: release-amd64
            artifact_name: binaries-amd64
          - os: macos-latest
            target: release-arm64
            artifact_name: binaries-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Binaries
        run: |
          make ${{ matrix.target }}
          ls -l bin/
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            ./scripts/check_release_minos.sh
          fi

      - name: Package release tarballs
        run: |
          # Package per-arch binaries into tar.gz release assets. `make`
          # writes the binaries into bin/, so the tarballs land there too and
          # the artifact upload below picks them up.
          if [[ "${{ matrix.target }}" == "release-arm64" ]]; then
            tar -czf bin/binaries-darwin-arm64.tar.gz -C bin analyze-darwin-arm64 status-darwin-arm64
            ls -lh bin/binaries-darwin-arm64.tar.gz
          elif [[ "${{ matrix.target }}" == "release-amd64" ]]; then
            tar -czf bin/binaries-darwin-amd64.tar.gz -C bin analyze-darwin-amd64 status-darwin-amd64
            ls -lh bin/binaries-darwin-amd64.tar.gz
          elif [[ "${{ matrix.target }}" == "release-linux-arm64" ]]; then
            tar -czf bin/binaries-linux-arm64.tar.gz -C bin analyze-linux-arm64 status-linux-arm64
            ls -lh bin/binaries-linux-arm64.tar.gz
          else
            tar -czf bin/binaries-linux-amd64.tar.gz -C bin analyze-linux-amd64 status-linux-amd64
            ls -lh bin/binaries-linux-amd64.tar.gz
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            bin/analyze-*
            bin/status-*
            bin/binaries-*
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bin
          pattern: binaries-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R bin/

      - name: Generate release checksums
        run: |
          cd bin
          mapfile -t release_files < <(find . -maxdepth 1 -type f -printf '%P\n' | sort)
          if [[ ${#release_files[@]} -eq 0 ]]; then
            echo "No release assets found"
            exit 1
          fi
          sha256sum "${release_files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/analyze-darwin-*
            bin/status-darwin-*
            bin/binaries-darwin-*.tar.gz
            bin/analyze-linux-*
            bin/status-linux-*
            bin/binaries-linux-*.tar.gz
            bin/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bin/*
          generate_release_notes: false
          draft: false
          prerelease: false
